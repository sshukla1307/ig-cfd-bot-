name: LIVE CFD Trading Loop (Real Capital)

# This workflow places REAL, LEVERAGED CFD orders against a REAL IG account.
# Kept isolated: own file, own concurrency group, own secrets.
#
# Two independent switches inside the job (not just this file existing) must
# both be true for an order to ever be submitted:
#   - IG_LIVE_TRADING_ENABLED=true  (master kill switch, set below)
#   - IG_LIVE=true                  (live vs demo IG environment, set below)
# To pause trading without deleting anything: disable this workflow from the
# repo's Actions tab, or flip IG_LIVE_TRADING_ENABLED to "false" below.

on:
  schedule:
    # Every 30 min, Sunday through Friday (skips Saturday, when every
    # commodity market covered here is universally closed). The precise
    # per-instrument gating happens in Python via IG's own live market-status
    # field, not this cron window -- this is deliberately a superset. Was
    # hourly (itself slowed from */5 min to match backtest.py's 1h-bar
    # timeframe and cut OpenAI cost) -- see gh-cron-pinger for the change.
    #
    # NOTE: this was found to be unreliable in practice -- GitHub's scheduler
    # dropped the vast majority of fires during 2026-08-27 through 08-31.
    # A repository_dispatch trigger (below) driven by an external Cloudflare
    # Worker Cron Trigger is now the primary tick source; this schedule
    # entry is kept only as a harmless secondary attempt.
    - cron: '*/30 * * * 0-5'
  repository_dispatch:
    types: [tick, watch]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: I UNDERSTAND REAL MONEY IS AT RISK'
        required: true

concurrency:
  group: live-cfd-trading-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6  # bumped from 4 -- OpenAI retry backoff (up to ~32s of sleep across 5 retries) needs room even on an occasional transient failure
    permissions:
      contents: write

    steps:
      - name: Require explicit confirmation on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "I UNDERSTAND REAL MONEY IS AT RISK" ]; then
            echo "Confirmation text did not match exactly. Aborting."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live CFD Tick
        env:
          IG_LIVE_TRADING_ENABLED: "true"
          IG_LIVE: "true"
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          SIFTING_API_KEY: ${{ secrets.SIFTING_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          # Only set for repository_dispatch -- "watch" runs the cheap check in
          # cfd_runner.run_watch_check instead of a full tick; anything else
          # (including this being unset, e.g. on schedule/workflow_dispatch)
          # runs the normal full tick.
          CFD_EVENT_TYPE: ${{ github.event.action }}
        run: python -m cfd_runner

      - name: Commit & Push Audit Log
        # Replaces stefanzweifel/git-auto-commit-action@v5's plain single-shot
        # push, which silently LOST several runs' worth of audit trail this
        # session whenever it lost a push race against another run: it would
        # commit locally, fail to push (rejected as non-fast-forward), and
        # just error out -- the ephemeral runner is torn down straight after,
        # taking that commit with it. This does the same fetch+rebase+retry a
        # human operator would do by hand on a rejected push, instead of
        # giving up after one attempt.
        #
        # A real workflow_dispatch-vs-watch race (2026-09-23) showed the
        # rebase itself can still hit a conflict, and the original version of
        # this step just aborted -- losing that tick's audit commit, exactly
        # what this step exists to prevent. Every conflict data/ can actually
        # produce is one of two harmless kinds (data/order_log.jsonl and
        # data/equity_history.jsonl are pure append-only logs; data/dashboard/
        # *.json are fully-regenerated snapshots, never real history), so
        # resolve_data_conflicts.py auto-resolves those specifically before
        # falling back to the same abort-rather-than-guess behavior for
        # anything else.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_EDITOR: "true"  # non-interactive `git rebase --continue` after auto-resolving conflicts below
        run: |
          set -e
          COMMIT_MSG="Live CFD tick: ${{ github.event.schedule || github.event.action || github.event_name }}"

          git add data
          if git diff --cached --quiet; then
            echo "No changes under data/ to commit."
            exit 0
          fi
          git commit -m "$COMMIT_MSG"

          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt/5 -- fetching and rebasing onto the latest origin/main before retrying."
            git fetch origin main
            if git rebase origin/main; then
              echo "Rebase succeeded cleanly."
            else
              echo "Rebase hit conflicts -- attempting automatic resolution of known-safe data files (append-only logs, regenerated dashboard snapshots) before giving up."
              if python3 resolve_data_conflicts.py && git rebase --continue; then
                echo "Conflicts were all known-safe data files -- auto-resolved and rebase continued."
              else
                echo "Rebase onto origin/main failed with a real, unresolvable conflict -- aborting rather than force through a bad state."
                git rebase --abort || true
                exit 1
              fi
            fi
            sleep $((attempt * 2))
          done

          echo "Still failed to push after 5 attempts -- giving up for this tick."
          exit 1
